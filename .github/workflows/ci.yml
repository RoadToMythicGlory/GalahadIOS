name: CI

# Push is limited to main so a release (commit + tag pushed together) starts
# one run, not two; tag pushes are covered by the Codemagic TestFlight build.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Compiles MediaCore and runs the full unit-test suite on macOS.
  swift-tests:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Swift version
        run: swift --version
      - name: Build MediaCore
        run: swift build
      - name: Run MediaCore unit tests
        run: swift test

  # Generates the Xcode project and compiles the app + broadcast extension
  # for iOS (unsigned). This proves the Swift/ObjC++ sources compile for the
  # real target even though device validation still needs physical hardware.
  ios-build:
    runs-on: macos-26
    permissions:
      contents: write # only to publish the GStreamer archive mirror release
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Fetch GStreamer iOS xcframework
        run: GSTREAMER_ARCHIVE_OUT="$RUNNER_TEMP/gstreamer-xcframework.tar.xz" bash Scripts/fetch-gstreamer-ios.sh
      # When the archive had to come from (slow) upstream, publish the verified
      # copy as a release asset so later CI and Codemagic builds fetch it fast.
      - name: Mirror GStreamer archive to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          GSTREAMER_ARCHIVE_OUT="$RUNNER_TEMP/gstreamer-xcframework.tar.xz"
          [[ -f "$GSTREAMER_ARCHIVE_OUT" ]] || { echo "Archive came from the mirror; nothing to publish."; exit 0; }
          VERSION="$(sed -n 's/^VERSION="\(.*\)"$/\1/p' Scripts/fetch-gstreamer-ios.sh)"
          TAG="gstreamer-ios-${VERSION}"
          ASSET="gstreamer-${VERSION}-xcframework.tar.xz"
          cp "$GSTREAMER_ARCHIVE_OUT" "$RUNNER_TEMP/$ASSET"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "GStreamer iOS ${VERSION} (mirror)" --latest=false \
            --notes "Unmodified copy of the official gstreamer-${VERSION}-xcframework.tar.xz, verified against upstream's .sha256sum. Used by Scripts/fetch-gstreamer-ios.sh."
          gh release upload "$TAG" "$RUNNER_TEMP/$ASSET" --clobber
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build Galahad (app + broadcast extension)
        run: |
          xcodebuild build \
            -project GalahadIOS.xcodeproj \
            -scheme Galahad \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

  # Honest device-validation gate reports (unchanged): these scripts emit
  # DEVICE VALIDATION REQUIRED until real Phase 2 evidence exists.
  report-scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Emit DEVICE VALIDATION REQUIRED report
        run: python Scripts/emit-device-validation-report.py
      - name: Packetization checker smoke
        run: python Tools/PacketizationCheck/check_pcap_or_sizes.py --sizes 1316 1316 1316
      - name: Upload report
        uses: actions/upload-artifact@v5
        with:
          name: phase2-report
          path: docs/reports/
