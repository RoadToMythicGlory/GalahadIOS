name: galahad-ios

# Push is limited to main so a release (commit + tag pushed together) starts
# one run, not two; tag pushes are covered by the Codemagic TestFlight build.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Compiles MediaCore and runs the full unit-test suite on macOS.
  swift-tests:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Swift version
        run: swift --version
      - name: Build MediaCore
        run: swift build
      - name: Run MediaCore unit tests
        run: swift test

  # Generates the Xcode project and compiles the app + broadcast extension
  # for iOS (unsigned). This proves the Swift/ObjC++ sources compile for the
  # real target even though device validation still needs physical hardware.
  ios-build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Fetch GStreamer iOS xcframework
        run: bash Scripts/fetch-gstreamer-ios.sh
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build Galahad (app + broadcast extension)
        run: |
          xcodebuild build \
            -project GalahadIOS.xcodeproj \
            -scheme Galahad \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

  # Honest device-validation gate reports (unchanged): these scripts emit
  # DEVICE VALIDATION REQUIRED until real Phase 2 evidence exists.
  report-scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Emit DEVICE VALIDATION REQUIRED report
        run: python Scripts/emit-device-validation-report.py
      - name: Packetization checker smoke
        run: python Tools/PacketizationCheck/check_pcap_or_sizes.py --sizes 1316 1316 1316
      - name: Upload report
        uses: actions/upload-artifact@v5
        with:
          name: phase2-report
          path: docs/reports/
