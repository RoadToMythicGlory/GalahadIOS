# Pinned dependency revisions for reproducible iOS builds.
# Fill SHAs only after a successful macOS/arm64 iOS build. Do not invent values.

gstreamer_ios:
  version: "1.28.6"
  artifact: "gstreamer-1.28.6-xcframework.tar.xz"
  source: "https://gstreamer.freedesktop.org/data/pkg/ios/1.28.6/"
  sha256: "48437f2a8f17bc1de40097eec9aedc0d307a30c15d9e996bf75bc07562bd79a5"
  fetched_by: "Scripts/fetch-gstreamer-ios.sh (CI + local macOS)"
  notes: "official prebuilt xcframework; merged static archive, only plugins registered in gst_ios_init.m are linked (srt, mpegtsmux, app, coreelements, ...)"

libsrt:
  revision: "UNPINNED — provided via GStreamer srt plugin / Haivision libsrt"
  preferred_payload_bytes: 1316
  topology: "caller-only"

video_encode:
  api: "VideoToolbox VTCompressionSession"
  codec: "HEVC / H.265"

apple_platforms:
  min_ios: "17.0"
  arch: "arm64"
